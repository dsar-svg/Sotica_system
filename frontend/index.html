<title>SOTICA-COSTOS</title>
<style>
  :root{
    --azul:#1B365D; --dorado:#C4A35A; --fondo:#F5F6F8; --panel:#fff;
    --borde:#DFE3E8; --texto:#1c2430; --tenue:#5d6b7a; --alerta:#9C0006;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 Calibri,Arial,system-ui,sans-serif;color:var(--texto);
       background:var(--fondo);height:100vh;display:flex;flex-direction:column}
  header{background:var(--azul);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:16px}
  header b{font-size:16px;letter-spacing:.5px}
  header .linea{height:3px;background:var(--dorado)}
  select{font:inherit;padding:4px 8px;border-radius:4px;border:1px solid #ffffff55;
         background:#ffffff18;color:#fff}
  main{flex:1;display:grid;grid-template-columns:1fr 360px;gap:14px;padding:14px;min-height:0}
  .col{display:flex;flex-direction:column;min-height:0;gap:12px}
  .card{background:var(--panel);border:1px solid var(--borde);border-radius:8px;
        display:flex;flex-direction:column;min-height:0}
  .card h2{margin:0;padding:9px 12px;font-size:12px;text-transform:uppercase;
           letter-spacing:.6px;color:var(--tenue);border-bottom:1px solid var(--borde)}
  #chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:9px 12px;border-radius:8px;white-space:pre-wrap}
  .yo{align-self:flex-end;background:var(--azul);color:#fff}
  .orq{align-self:flex-start;background:#EDF1F6;border:1px solid var(--borde)}
  .tool{align-self:flex-start;font-size:12px;color:var(--tenue);font-family:Consolas,monospace}
  form.chat{display:flex;gap:8px;padding:10px;border-top:1px solid var(--borde)}
  textarea{flex:1;resize:none;font:inherit;padding:8px;border:1px solid var(--borde);border-radius:6px}
  button{font:inherit;background:var(--azul);color:#fff;border:0;border-radius:6px;
         padding:8px 14px;cursor:pointer}
  button.sec{background:#fff;color:var(--azul);border:1px solid var(--azul)}
  .cuerpo{padding:12px;overflow-y:auto;font-size:13px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
  .kv span:last-child{font-weight:700}
  .aviso{background:#FDF3F3;border:1px solid #F0C8C8;color:var(--alerta);
         padding:8px 10px;border-radius:6px;margin-bottom:10px;font-size:12.5px}
  .item{border-top:1px solid var(--borde);padding:7px 0;font-size:12.5px}
  .item:first-child{border-top:0}
  a{color:var(--azul)}
  label{display:block;font-size:12px;color:var(--tenue);margin:6px 0 2px}
  input[type=text],input[type=date],input[type=file],form.ev textarea{
    width:100%;font:inherit;padding:6px;border:1px solid var(--borde);border-radius:5px}
</style>

<header>
  <b>SOTICA-COSTOS</b>
  <span style="font-size:12px;opacity:.75">ORQ-COST · SUB-CM · SUB-DOC · SUB-AVA</span>
  <select id="obra" style="margin-left:auto"></select>
</header>
<div class="linea" style="height:3px;background:var(--dorado)"></div>

<main>
  <div class="col">
    <div class="card" style="flex:1">
      <h2>Chat con el orquestador</h2>
      <div id="chat"></div>
      <form class="chat" id="fchat">
        <textarea id="msg" rows="2" placeholder="¿Cómo va la obra? / Computa las zapatas del eje 4 / Genera el Excel de cómputos"></textarea>
        <button>Enviar</button>
      </form>
    </div>
  </div>

  <div class="col">
    <div class="card">
      <h2>Estado de obra</h2>
      <div class="cuerpo" id="estado">Selecciona una obra.</div>
    </div>
    <div class="card">
      <h2>Cargar avance de obra</h2>
      <div class="cuerpo">
        <form class="ev" id="fev">
          <label>Reportado por</label>
          <input type="text" id="quien" placeholder="Ing. residente" required>
          <label>Fecha del avance en obra</label>
          <input type="date" id="fecha" required>
          <label>Reporte (texto libre)</label>
          <textarea id="texto" rows="3" placeholder="Se vaciaron 4 zapatas del eje 4..."></textarea>
          <label>Fotos / valuaciones</label>
          <input type="file" id="files" multiple>
          <button class="sec" style="margin-top:10px">Subir reporte</button>
        </form>
      </div>
    </div>
    <div class="card" style="flex:1">
      <h2>Archivos generados</h2>
      <div class="cuerpo" id="entregables">—</div>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let obraActual = null;

async function cargarObras(){
  const obras = await (await fetch('/api/proyectos')).json();
  $('obra').innerHTML = obras.map(o =>
    `<option value="${o.codigo}">${o.codigo} — ${o.nombre_obra}</option>`).join('');
  if (obras.length) { obraActual = obras[0].codigo; refrescar(); }
}

async function refrescar(){
  if (!obraActual) return;
  const e = await (await fetch(`/api/proyectos/${obraActual}/estado`)).json();
  const c = e.configuracion || {};
  const pct = (v) => v === null || v === undefined ? '—' : v.toFixed(2) + ' %';
  $('estado').innerHTML = `
    <div class="aviso">${e.advertencia_datos}</div>
    <div class="kv"><span>Avance físico real</span><span>${pct(e.avance_fisico_real_pct)}</span></div>
    <div class="kv"><span>Avance planificado</span><span>${pct(e.avance_fisico_plan_pct)}</span></div>
    <div class="kv"><span>Desviación</span><span>${e.desviacion_pp === null ? '—' : e.desviacion_pp.toFixed(2)+' pp'}</span></div>
    <div class="kv"><span>Avance financiero</span><span>${pct(e.avance_financiero_pct)}</span></div>
    <div class="kv"><span>Partidas sin avance</span><span>${e.partidas_sin_avance}</span></div>
    <div class="kv"><span>Bloqueos abiertos</span><span>${e.bloqueos_abiertos}</span></div>
    <div class="kv"><span>Avances retenidos</span><span>${e.avances_en_espera}</span></div>
    ${c.nota ? `<div class="aviso" style="margin-top:10px">${c.nota}<br>
      Umbrales ${c.umbrales_pp.media}/${c.umbrales_pp.alta}/${c.umbrales_pp.critica} pp ·
      ponderación por ${c.base_ponderacion}.</div>` : ''}
    ${(e.desviaciones_abiertas||[]).map(d =>
      `<div class="item"><b>${d.severidad.toUpperCase()} · ${d.tipo}</b><br>${d.descripcion}</div>`).join('')}
  `;
  const ent = await (await fetch(`/api/proyectos/${obraActual}/entregables`)).json();
  $('entregables').innerHTML = ent.length ? ent.map(a =>
    `<div class="item"><a href="${a.url}">${a.nombre}</a><br>
     <span style="color:var(--tenue)">${a.codigo_documento} Rev.${a.revision} · ${a.generado_por}
     ${a.formato_oficial ? '' : ' · formato propuesto'}</span></div>`).join('')
    : 'Sin archivos generados todavía.';
}

function burbuja(clase, texto){
  const d = document.createElement('div');
  d.className = 'msg ' + clase;
  d.textContent = texto;
  $('chat').appendChild(d);
  $('chat').scrollTop = $('chat').scrollHeight;
  return d;
}

$('obra').onchange = (ev) => { obraActual = ev.target.value; $('chat').innerHTML=''; refrescar(); };

$('fchat').onsubmit = async (ev) => {
  ev.preventDefault();
  const texto = $('msg').value.trim();
  if (!texto) return;
  burbuja('yo', texto);
  $('msg').value = '';
  const resp = await fetch('/api/chat', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({proyecto: obraActual, mensaje: texto})
  });
  const lector = resp.body.getReader();
  const dec = new TextDecoder();
  let buffer = '', actual = null;
  while (true) {
    const {done, value} = await lector.read();
    if (done) break;
    buffer += dec.decode(value, {stream:true});
    const partes = buffer.split('\n\n'); buffer = partes.pop();
    for (const p of partes) {
      if (!p.startsWith('data: ')) continue;
      const ev2 = JSON.parse(p.slice(6));
      if (ev2.tipo === 'texto') {
        if (!actual) actual = burbuja('orq', '');
        actual.textContent += ev2.texto;
        $('chat').scrollTop = $('chat').scrollHeight;
      } else if (ev2.tipo === 'herramienta') {
        burbuja('tool', '⚙ ' + ev2.nombre); actual = null;
      } else if (ev2.tipo === 'error') {
        burbuja('tool', '⚠ ' + ev2.texto);
      } else if (ev2.tipo === 'fin') {
        actual = null; refrescar();
      }
    }
  }
};

$('fev').onsubmit = async (ev) => {
  ev.preventDefault();
  const fd = new FormData();
  fd.append('reportado_por', $('quien').value);
  fd.append('fecha_reporte', $('fecha').value);
  fd.append('texto_libre', $('texto').value);
  for (const f of $('files').files) fd.append('archivos', f);
  const r = await (await fetch(`/api/proyectos/${obraActual}/reportes`, {method:'POST', body:fd})).json();
  burbuja('tool', `📎 Reporte ${r.reporte_id} cargado (crudo, sin interpretar).`);
  $('texto').value = ''; $('files').value = '';
};

$('fecha').valueAsDate = new Date();
cargarObras();
</script>
